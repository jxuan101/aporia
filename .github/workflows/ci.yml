name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aporia_test
          POSTGRES_USER: aporia
          POSTGRES_PASSWORD: aporia-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aporia -d aporia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aporia:aporia-local@127.0.0.1:5432/aporia_test
      APORIA_TEST_DATABASE_URL: postgresql://aporia:aporia-local@127.0.0.1:5432/aporia_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -e '.[test]'

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run backend tests
        run: make integration-test

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
