services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: braindump
      POSTGRES_USER: braindump
      POSTGRES_PASSWORD: braindump-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - braindump-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braindump -d braindump"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  braindump-postgres:
