services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aporia
      POSTGRES_USER: aporia
      POSTGRES_PASSWORD: aporia-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aporia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aporia -d aporia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aporia-postgres:
